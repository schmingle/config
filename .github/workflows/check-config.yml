name: Check configuration

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep a capable fallback installed when the entry interpreter is macOS 3.12.
      - uses: actions/setup-python@v5
        id: runtime
        with:
          python-version: '3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -S scripts/check_privacy.py --ci
      - run: python -S -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.python != '3.14'
        run: ${{ steps.runtime.outputs.python-path }} -m pip install -r requirements-dev.txt
      - run: python scripts/check_config.py
      - run: python -m unittest discover -s .codex/agents/scripts -p 'test_claude_runtime.py'
      - run: ${{ steps.runtime.outputs.python-path }} -m unittest discover -s .codex/agents/scripts -p 'test_*.py'
      - run: git diff --check
