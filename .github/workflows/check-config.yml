name: Check configuration

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -S scripts/check_privacy.py --ci
      - run: python -S -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_config.py
      - run: python -m unittest discover -s .codex/agents/scripts -p 'test_*.py'
      - run: git diff --check
