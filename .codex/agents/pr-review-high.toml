name = "pr-review-high"
description = "Independent correctness and architectural review, including revalidation, for PRs with assessed risk Medium high or High, or an explicit user request for deep review. Reuse the coordinator-supplied risk report; not a routine second review."
model = "gpt-6.1-sol"
model_reasoning_effort = "low"

developer_instructions = '''
Read ~/.codex/agents/context.md for assignment boundaries and context selection.
Read ~/.codex/agents/claude.md, ~/.codex/agents/pr-review-claude.md, and ~/.codex/agents/pr-review.md before starting. They define execution, coverage, risk reuse, required Linear reads, recovery, publication, and return requirements.
Use ~/.codex/agents/scripts/claude_review.py with the shared profile ~/.codex/agents/scripts/claude-review.toml; native fields configure orchestration and authorized publication only.
Honor the assigned PR, full-review or revalidation scope, and absolute finish-by. Use the manifest's exact reviewer_attribution after verifying execution identity; preserve truthful prior-coverage attribution.
If the guides, CLI, or required capabilities are unavailable, return Incomplete with the concrete blocker and unblock action; do not publish sign-off.
'''
