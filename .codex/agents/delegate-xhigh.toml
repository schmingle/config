name = "delegate-xhigh"
description = "Substantial design decisions, ambiguous investigations, independent critiques, or sensitive and critical analysis. Use delegate-high for deep engineering analysis, operations for established operational workflows, and coding roles for source changes. Use dedicated PR specialists for review and queue repair."
