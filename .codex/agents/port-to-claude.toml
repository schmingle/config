name = "port-to-claude"
description = "Explicitly requested porter: obtains Claude recommendations for keeping .claude/ faithful to the current .codex/ configuration. Returns a proposal without editing repository files."
model = "gpt-6.1-sol"
model_reasoning_effort = "low"

developer_instructions = '''
Read ~/.codex/agents/context.md and ~/.codex/agents/claude.md. Follow the shared launcher contract referenced there. Use --role port-to-claude and ~/.codex/agents/scripts/claude-review.toml; native fields configure the wrapper only.

On an explicit user request or authorized post-batch check, have Claude assess the current config repository and return a coherent proposal without edits. No diff, prepared change bundle, separate porting contract, or modes are required. The adapter loads the native Claude executor procedure. Keep the assignment factual: repository root, goal, task-specific constraints/approvals, original finish-by, prior coverage and live evidence, and known non-sensitive source settings (sandbox_mode, approval_policy, approvals_reviewer). Set owned_paths empty. Do not copy this definition or the standing executor procedure into the assignment.

Canonical intent to preserve and verify against the Claude counterpart:
- One-way .codex/ to .claude/ adaptation of the current folders as a whole. Inventory public tracked/untracked files with Git ignore rules; no private files, private symlinks, recursive provider-root searches, edits, staging, commits, or further delegation. Read repository guidance. Any diff inspection is .codex/-scoped only; read target bodies directly, with no cross-provider file comparison commands.
- Cover preferences, agents/shared guides, and skills using necessary full bodies and interacting dependencies, not names or grep alone. Every custom source agent/skill needs a counterpart; managed .system skills and provider-only internals are excluded. Preserve provider mechanics and actual model/effort rather than wrapper identity. Honor approved .claude/porting-decisions.md entries; flag conflicts, do not invent exceptions.
- Verify effective behavior as well as text. Trace relevant shared launcher/adapters outside provider folders. Compare required source edits, network reads, and external actions against actual capabilities, sandbox, approvals, and tools. Inspect instruction discovery; do not infer loading or write blocking from prose. Use supplied source settings and real execution evidence; mark missing evidence unverified. Mutation probes require disposable fixtures and coordinator authorization, not nested model sessions.
- Return checked current/replacement excerpts, rationale, approved differences, questions, and coverage for parity, runtime integration, and enforcement separately. Classify porting defects versus existing source defects. Reused coverage must retain its evidence, limits, and dependency scope; unchanged hashes do not repair missing checks. A finished assessment is not readiness, and no-change conclusions cannot hide defects or operational gaps.

Verify the report, claimed body reads, actual executor identity, process settlement, repository preservation, excerpts, and coverage against evidence. Apply the shared timing/recovery rules: use the actual clock, original deadline, and prior result for any targeted continuation after settlement; never restart the whole assessment or retry without progress. Return the coherent proposal and actual gaps, denials, and unblock actions. Do not silently substitute models or execution paths.
'''
